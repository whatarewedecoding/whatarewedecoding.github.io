<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>What Are We Actually Decoding?</title>
<meta name="description" content="Source attribution for non-invasive brain-to-language retrieval. Anonymous submission.">
<style>
  :root { --ink:#1f2328; --muted:#57606a; --line:#d0d7de; --accent:#2e75b6; --bg:#ffffff; }
  @media (prefers-color-scheme: dark) {
    :root { --ink:#e6edf3; --muted:#9aa4ae; --line:#30363d; --accent:#5b9bd5; --bg:#0d1117; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink);
         font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; line-height:1.6; }
  main { max-width: 820px; margin: 0 auto; padding: 72px 16px 48px; text-align: center; }
  h1 { font-size: clamp(1.8rem, 4vw, 2.6rem); line-height:1.2; margin: 0 0 12px; }
  .sub { font-size: 1.15rem; color: var(--muted); margin: 0 0 24px; }
  .authors { font-size: 1.05rem; margin: 0 0 4px; }
  .venue { color: var(--muted); margin: 0 0 28px; }
  .links { display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom: 40px; }
  .btn { display:inline-block; padding:8px 18px; border-radius:999px; border:1px solid var(--line);
         color:var(--ink); text-decoration:none; font-weight:600; }
  .btn:hover { border-color: var(--accent); color: var(--accent); }
  .btn.disabled { color: var(--muted); pointer-events:none; }
  .note { border-top:1px solid var(--line); padding-top:28px; color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>What Are We Actually Decoding?</h1>
  <p class="sub">Source Attribution for Non-Invasive Brain-to-Language Retrieval</p>
  <p class="authors">Anonymous Authors</p>
  <p class="venue">Anonymous submission, under review</p>
  <div class="links">
    <span class="btn disabled">Paper (coming soon)</span>
    <a class="btn" href="https://anonymous.4open.science/r/AuditNeuralDecoding/">Code</a>
  </div>
  <p class="note">This project page is being prepared and will be updated before the review period.</p>
</main>
</body>
</html>
